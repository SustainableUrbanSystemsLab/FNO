# FNO Training Configuration
# Edit this file to customize training parameters

[paths]
# Training data paths - script auto-detects platform
# ⚠️  NEW USER: Update data_folder_ice to your ICE scratch path:
#     /home/hice1/<YOUR_GT_USERNAME>/scratch/Training_Dataset
data_folder_windows = "C:/LabShare/Dataset/FormFluxCases/Compressed/Training_Dataset"
data_folder_linux = "./train_csv"
data_folder_ice = "/home/hice1/athach7/scratch/Training_Dataset"

# Path to test CSV files for inference
test_folder = 'test_csv'

# Output model filename
model_output = "fno_mag_weights.pth"

[training]
batch_size = 8
epochs = 200
learning_rate = 1e-4
patience = 50
checkpoint_interval = 10

[model]
# Sufficient modes to capture narrow building wakes
modes1 = 48
modes2 = 48
width = 128
n_layers = 4
dropout = 0.02

[loss]
# Balanced with MSE to allow features to emerge
gradient_weight   = 1.5
spectral_weight   = 0.001
peak_weight       = 0.5
wake_weight       = 1.0
warmup_epochs     = 10     # Drop warmup so physics kicks in early

# PINN-specific physics constraints
continuity_weight = 1.0    # Increased to enforce ∇·u ≈ 0
momentum_weight   = 0.1 

[performance]
# Number of parallel workers for data loading (0 = auto-detect)
num_workers = 0

[pace]
# PACE cluster configuration (required for job submission)
# Set your account, e.g., "gts-ikaradag3"
account = "gts-pkastner3"
# Partition (leave empty for default)
partition = ""
# Walltime for the job (HH:MM:SS)
walltime = "08:00:00"

[ice]
# ICE cluster configuration
account = "coa"
partition = "" # Optional, add if needed
walltime = "08:00:00"
