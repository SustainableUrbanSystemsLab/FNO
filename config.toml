# FNO Training Configuration
# Edit this file to customize training parameters

[paths]
# Training data paths - script auto-detects platform
# ⚠️  NEW USER: Update data_folder_ice to your ICE scratch path:
#     /home/hice1/<YOUR_GT_USERNAME>/scratch/Training_Dataset
data_folder_windows = "C:/LabShare/Dataset/FormFluxCases/Compressed/Training_Dataset"
data_folder_linux = "./train_csv"
data_folder_ice = "data"

# Path to test CSV files for inference
test_folder = 'test_csv'

# Output model filename
model_output = "fno_mag_weights.pth"

[training]
batch_size = 4
epochs = 200
learning_rate = 1e-4
patience = 50
checkpoint_interval = 10
val_split = 0.1       # Fraction of data held out for validation (fixed seed=42)
dropout = 0.1         # Increased to prevent overfitting

[model]
modes1 = 48
modes2 = 48
width = 64
n_layers = 4
dropout = 0.1 # Sync with training section if script uses this one

[loss]
# Balanced with MSE to allow features to emerge
gradient_weight   = 1.5
spectral_weight   = 0.001
peak_weight       = 0.5
wake_weight       = 1.0
warmup_epochs     = 10

# Per-output-channel importance for the 4-channel target [U, k, U_roof, k_roof].
# Applied per-channel-normalized (each channel weighted by its own valid-pixel
# MSE, not diluted by how many valid pixels it happens to have) -- see
# core/models/fno2d.py::_per_channel_weighted. U is the primary evaluated
# channel; k and U_roof are secondary; k_roof is the least critical.
# Only used when out_channels > 1 (single-channel legacy training ignores this).
channel_weights   = [1.0, 0.5, 0.5, 0.25]

# PINN-specific physics constraints
continuity_weight = 1.0    # Increased to enforce ∇·u ≈ 0
momentum_weight   = 0.1 

[performance]
# Number of parallel workers for data loading (0 = auto-detect)
num_workers = 4

[pace]
# PACE cluster configuration (required for job submission)
# Set your account, e.g., "gts-ikaradag3"
account = "gts-pkastner3"
# Partition (leave empty for default)
partition = ""
# Walltime for the job (HH:MM:SS)
walltime = "08:00:00"

[ice]
# ICE cluster configuration
account = "gts-pkastner3"
partition = "" # Optional, add if needed
walltime = "08:00:00"
