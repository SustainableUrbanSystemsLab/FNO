# FNO Training Configuration
# Edit this file to customize training parameters

[paths]
# Training data paths - script auto-detects platform
data_folder_windows = "C:/LabShare/Dataset/FormFluxCases/Compressed/Training_Dataset"
data_folder_linux = "/storage/coda1/p-pkastner3/0/ikaradag3/FNO/Training_Dataset"

# Path to test CSV files for inference
test_folder = 'test_csv'

# Output model filename
model_output = "fno_mag_weights.pth"

[training]
batch_size = 4
epochs = 500            # Increased from 200 for better convergence
learning_rate = 0.0005  # Reduced from 0.001 for more stable training
patience = 75           # Increased from 50 to allow more exploration
checkpoint_interval = 25  # Save resumable checkpoint every N epochs

[model]
modes1 = 48  # Increased from 32 for sharper predictions
modes2 = 48  # Increased from 32 for sharper predictions
width = 96
n_layers = 5

[loss]
# Loss function weights (MSE is always 1.0)
gradient_weight = 0.30  # Increased for sharper building edges
spectral_weight = 0.0   # Disabled for multi-GPU stability

[performance]
# Number of parallel workers for data loading (0 = auto-detect)
num_workers = 0

[pace]
# PACE cluster configuration (required for job submission)
# Set your account, e.g., "gts-ikaradag3"
account = "gts-pkastner3"
# Partition (leave empty for default)
partition = ""
