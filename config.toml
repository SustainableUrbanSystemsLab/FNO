# FNO Training Configuration
# Edit this file to customize training parameters

[paths]
# Training data paths - script auto-detects platform
data_folder_windows = "C:/LabShare/Dataset/FormFluxCases/Compressed/Training_Dataset"
data_folder_linux = "./train_csv"
data_folder_ice = "/storage/ice1/2/4/athach7/Training_Dataset"

# Path to test CSV files for inference
test_folder = 'test_csv'

# Output model filename
model_output = "fno_mag_weights.pth"

[training]
batch_size = 4
epochs = 1000
learning_rate = 1e-4    # Lowered for Hybrid stability
patience = 100
checkpoint_interval = 10  # Save resumable checkpoint every N epochs

[model]
modes1 = 32  # Reduced for faster convergence (was 48)
modes2 = 32
width = 64   # Reduced for faster convergence (was 96)
n_layers = 4

[loss]
# Loss function weights (MSE is always 1.0)
gradient_weight = 2.0   # High for sharpness
spectral_weight = 0.01  # Increased slightly to help FNO converge
peak_weight = 0.5
wake_weight = 1.0       # High priority for wake capture

# PINN-specific physics constraints
continuity_weight = 0.1   # Penalize non-divergence-free predictions (∇·u ≈ 0)
momentum_weight = 0.05    # Penalize physically implausible sharp spikes (ν∇²u)

[performance]
# Number of parallel workers for data loading (0 = auto-detect)
num_workers = 0

[pace]
# PACE cluster configuration (required for job submission)
# Set your account, e.g., "gts-ikaradag3"
account = "gts-pkastner3"
# Partition (leave empty for default)
partition = ""
# Walltime for the job (HH:MM:SS)
walltime = "04:00:00"

[ice]
# ICE cluster configuration
account = "coc"
partition = "" # Optional, add if needed
walltime = "04:00:00"
