# Quick test config — runs 2 epochs to verify data pipeline works
# Usage: bash slurm/deploy_ice.sh --config configs/config_test.toml --gpu h200 --ngpus 1 --fresh

[paths]
data_folder_windows = "C:/LabShare/Dataset/FormFluxCases/Compressed/Training_Dataset"
data_folder_linux = "./train_csv"
data_folder_ice = "/home/hice1/athach7/scratch/Training_Dataset"
test_folder = 'test_csv'
model_output = "fno_test_weights.pth"

[training]
batch_size = 4
epochs = 200
learning_rate = 1e-4
patience = 50
checkpoint_interval = 1
dropout = 0.15
val_split = 0.1

[model]
modes1 = 64
modes2 = 64
width = 64
n_layers = 4
dropout = 0.15

[loss]
gradient_weight   = 0.5
spectral_weight   = 0.01
peak_weight       = 0.5
wake_weight       = 0.5
warmup_epochs     = 10

[performance]
num_workers = 4

[ice]
account = "coc"
partition = ""
walltime = "24:00:00"
